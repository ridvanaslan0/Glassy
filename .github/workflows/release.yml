name: Release

# Push a tag like v1.0.0 to build the executable and publish a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Build Glassy.exe
        run: ./build.sh

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist/Glassy
          cp build/Glassy.exe LICENSE README.md dist/Glassy/
          (cd dist && zip -r "Glassy-${VERSION}-win-x64.zip" Glassy)
          (cd dist && sha256sum "Glassy-${VERSION}-win-x64.zip" > "Glassy-${VERSION}-win-x64.zip.sha256")

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Glassy-*-win-x64.zip
            dist/Glassy-*-win-x64.zip.sha256
